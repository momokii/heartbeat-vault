# Heartbeat Vault — standard profile (base)
# Services: api + postgres + caddy (reverse proxy).
# Hardened profile (Vault/OpenBao) is ADR-only in v1 — not defined here (T6.1).
# All images are pinned by digest — never `latest` (SECURITY_STANDARDS.md).
# Secrets are injected via env_file / environment — never baked into images.
# DB is NOT externally exposed — only reachable via `app_net` (least-privilege).

name: heartbeat-vault

services:
  # ── PostgreSQL 17 — primary datastore ──────────────────────────────────
  db:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    # postgres:17-alpine — pinned digest above; renovate/dependabot will bump.
    restart: "no"
    # No `ports:` — DB is internal-only. Dev override may bind 127.0.0.1:5432.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heartbeat_vault}
      POSTGRES_USER: ${POSTGRES_USER:-heartbeat}
      # Required in prod — set a real value in .env (generated by install.sh).
      # Default dev placeholder allows `docker compose config` without .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net
    # Least-privilege: official postgres image drops to `postgres` user (uid 70)
    # automatically; no additional `user:` needed here. Verified via `docker inspect`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heartbeat} -d ${POSTGRES_DB:-heartbeat_vault}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 2s

  # ── API — placeholder until Phase 3+ real implementation ─────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: heartbeat-vault-api:local
    restart: "no"
    # No `ports:` — exposed only through Caddy on app_net.
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${APP_ENV:-development}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-heartbeat}:${POSTGRES_PASSWORD:-change-me-dev-only}@db:5432/${POSTGRES_DB:-heartbeat_vault}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Placeholder secrets — real values required from Phase 3+ onward.
      SESSION_SECRET: ${SESSION_SECRET:-dev-placeholder-change-me}
      # Master key placeholder — envelope encryption (Phase 2) will require a real 32B key.
      MASTER_KEY: ${MASTER_KEY:-dev-placeholder-change-me-32B-min}
    networks:
      - app_net
    # Non-root enforced inside the Dockerfile (USER node, uid 1000).
    # No `user:` override needed — Dockerfile is authoritative.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"import('node:http').then(({request})=>{const r=request({hostname:'127.0.0.1',port:process.env.PORT||3000,path:'/api/health',timeout:2000},res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.end();})\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s

  # ── Caddy — TLS-terminating reverse proxy ────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: heartbeat-vault-caddy:local
    # caddy:2-alpine — pinned digest; handles automatic TLS (tls internal for LAN).
    restart: "no"
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"
      # Admin API is NOT published — only reachable inside app_net by healthcheck.
      # If host admin access is needed, publish 127.0.0.1:2019 in override only.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    networks:
      - app_net
    healthcheck:
      # Caddy admin API must respond — validate via wget (busybox) inside the image.
      # Falls back to config validation if admin is disabled.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:2019/config/ || wget --no-verbose --tries=1 --spider http://127.0.0.1:80/caddy-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 5s

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
