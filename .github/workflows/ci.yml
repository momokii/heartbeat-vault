# CI gate — must pass before merge (BRIEF §12).
# Runs the exact commands a maintainer runs locally; no fabricated results.
# Secret scanning via gitleaks; SAST runs separately in codeql.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium (E2E)
        run: pnpm --filter @heartbeat-vault/e2e exec playwright install --with-deps chromium

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Dependency audit (fails on new advisories; known dev-only set ignored via pnpm.auditConfig)
        run: pnpm audit --audit-level=low

  tests:
    # Per-package suites run as separate jobs so a failure names its package
    # in the public checks list (the combined step hid which suite failed).
    # JUnit reports annotate failing tests on the commit for the same reason.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        package: [api, web, crypto, db, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium (E2E only)
        if: matrix.package == 'e2e'
        run: pnpm --filter @heartbeat-vault/e2e exec playwright install --with-deps chromium

      - name: Test ${{ matrix.package }} (vitest)
        if: matrix.package != 'e2e'
        run: pnpm --filter @heartbeat-vault/${{ matrix.package }} test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Test e2e (playwright)
        if: matrix.package == 'e2e'
        run: pnpm --filter @heartbeat-vault/e2e test -- --reporter=junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit.xml

      - name: Annotate test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: tests-${{ matrix.package }}
          report_paths: '**/test-results/junit.xml'
          fail_on_failure: false

      - name: Summarize test failure diagnostics
        if: failure()
        run: |
          {
            echo "## Test failure diagnostics (${{ matrix.package }})"
            echo ""
            echo "### Disk and memory"
            df -h / | tail -1
            free -g | head -2 || true
            echo ""
            echo "### Docker state"
            docker ps --format '{{.Names}} ({{.Status}})' 2>/dev/null | head -20 || echo "docker unavailable"
            docker system df 2>/dev/null | head -8 || true
            echo ""
            echo "### JUnit report"
            ls -la "${{ matrix.package }}/test-results/" 2>/dev/null || ls -la "apps/${{ matrix.package }}/test-results/" 2>/dev/null || echo "no junit dir"
            echo ""
            echo "### Failing tests"
            python3 - "$GITHUB_WORKSPACE" <<'EOF' || echo "junit parse unavailable"
          import glob
          import os
          import xml.etree.ElementTree as ET
          base = os.environ.get("GITHUB_WORKSPACE", ".")
          files = glob.glob(os.path.join(base, "**/test-results/junit.xml"), recursive=True)
          print("junit files:", files if files else "NONE FOUND")
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  print(f"{path}: unparsable ({exc})")
                  continue
              for case in root.iter("testcase"):
                  bad = list(case.iter("failure")) + list(case.iter("error"))
                  if bad:
                      print(f"FAILED: {case.get('classname')}::{case.get('name')}")
                      print("  " + (bad[0].get("message") or "")[:300])
          EOF
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  caddy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium (Caddy smoke)
        run: pnpm --filter @heartbeat-vault/e2e exec playwright install --with-deps chromium

      - name: Run disposable Caddy preview smoke
        run: bash .github/scripts/caddy-preview-smoke.sh
